---
- name: Run the app as one Docker container
  hosts: app
  become: true

  tasks:
    # Download the image J3 pushed.
    - name: Pull the latest image from Docker Hub
      command: docker pull fatehphd/web-project:latest

    # Remove the container from the last run. On the very first run there isn't one, so don't fail.
    - name: Remove the old container if there is one
      command: docker rm -f web-project
      failed_when: false

    # Run it in the background (-d), restart it if the server reboots, server port 80 -> Nginx port 80.
    - name: Start the container on port 80
      command: docker run -d --name web-project --restart unless-stopped -p 80:80 fatehphd/web-project:latest